[package]
name = "jlrs-launcher"
version = "0.1.0"
authors = ["Thomas van Doornmalen <thomas.vandoornmalen@gmail.com>"]
description = """
A juliaup-aware launcher for projects that use jlrs
"""
homepage = "https://github.com/Taaitaaiger/jlrs-launcher"
repository = "https://github.com/Taaitaaiger/jlrs-launcher"
keywords = ["Julia", "jlrs", "ffi", "interop"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[dependencies]
juliaup = "1.18"
clap = "4.5"
anyhow = "1.0"
normpath = "1.5"
thiserror = "2.0"
console = "0.16"
ctrlc = "3.5"
itertools = "0.14"
human-panic = "2.0"
env_logger = "0.11"
is-terminal = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation","Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(not(windows))'.dependencies]
nix = { version = "0.30", features = ["process"] }
